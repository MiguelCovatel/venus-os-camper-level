[mqtt]
host = 127.0.0.1
port = 1883
username =
password =
password_env = CAMPER_LEVEL_MQTT_PASSWORD
base_topic = camper/level
client_id = venus-camper-level
keepalive_s = 30

[service]
level_settings_file = /data/conf/camper-level/level-settings.json
dbus_name = com.victronenergy.camperlevel
device_instance = 42
native_dbus_name = com.victronenergy.switch.camperlevel
native_device_instance = 42
product_name = Camper Level
custom_name = Camper Level
serial = camper-level
firmware_version = 1.1.0
log_level = INFO

[timeouts]
warning_s = 10
critical_s = 30
message_max_age_s = 30
future_tolerance_s = 60
