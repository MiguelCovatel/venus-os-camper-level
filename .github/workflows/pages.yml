name: Web installer

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "web-installer/**"
      - "docs/images/cableado-esp32-c3-mpu.svg"
      - "scripts/validate-web-installer.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio
      - run: pio run -d firmware -e esp32-c3-supermini
      - name: Assemble installer site
        shell: bash
        run: |
          mkdir -p _site/firmware
          cp -R web-installer/. _site/
          cp docs/images/cableado-esp32-c3-mpu.svg _site/cableado.svg
          cp firmware/.pio/build/esp32-c3-supermini/bootloader.bin _site/firmware/
          cp firmware/.pio/build/esp32-c3-supermini/partitions.bin _site/firmware/
          cp firmware/.pio/build/esp32-c3-supermini/firmware.bin _site/firmware/
          BOOT_APP0=$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -type f -path '*/tools/partitions/boot_app0.bin' -print -quit)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" _site/firmware/boot_app0.bin
      - run: python scripts/validate-web-installer.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
