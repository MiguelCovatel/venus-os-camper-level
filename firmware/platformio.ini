[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_upload.before_reset = usb_reset
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CAMPER_I2C_SDA=8
    -D CAMPER_I2C_SCL=9
    -D CORE_DEBUG_LEVEL=2

[env:native]
platform = native
lib_deps = throwtheswitch/Unity@2.6.1
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -Isrc
build_src_filter =
    -<*>
    +<level/level_calculator.cpp>
    +<level/stability_detector.cpp>
    +<communication/retry_backoff.cpp>

[env:esp32-c3-tests]
extends = env:esp32-c3-supermini
test_build_src = yes
build_src_filter =
    -<*>
    +<level/level_calculator.cpp>
    +<level/stability_detector.cpp>
    +<communication/retry_backoff.cpp>
